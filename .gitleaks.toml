title = "Lab gitleaks config"

[[rules]]
id = "demo-secret"
description = "DEMO_SECRET test value for lab work"
regex = '''(?i)DEMO_SECRET\s*=\s*demo_[0-9a-f-]{36}'''
keywords = ["DEMO_SECRET"]

[allowlist]
description = "Allow test and documentation files with demo secrets"
paths = [
  "README.md",
  "INSTALL.txt",
  ".*gitleaks-before\\.json",
  ".*gitleaks-after\\.json",
  ".*gitleaks-check\\.json"
]