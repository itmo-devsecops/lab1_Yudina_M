title = "Lab gitleaks config"

[[rules]]
id = "demo-secret"
description = "DEMO_SECRET test value for lab work"
regex = '''(?i)DEMO_SECRET\s*=\s*demo_[0-9a-f-]{36}'''
keywords = ["DEMO_SECRET"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
# Немного упрощённый шаблон — чтобы ловить даже тестовые ключи
regex = '''AKIA[0-9A-Z]{10,20}'''
tags = ["key", "AWS"]

[allowlist]
paths = [
  "README.md",
  "INSTALL.txt",
  "gitleaks-before.json",
  "gitleaks-after.json"
]
