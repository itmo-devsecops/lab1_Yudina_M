<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 80%%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #e0e0e0;
        }
        .button {
            display: block;
            width: 200px;
            text-align: center;
            margin: 20px auto;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Список студентов</h1>
    <a class="button" href="{{ url_for('add_student') }}">Добавить студента</a>
    <table>
        <tr>
            <th>ID</th>
            <th>Фамилия</th>
            <th>Имя</th>
            <th>Отчество</th>
            <th>Курс</th>
            <th>Группа</th>
            <th>Факультет</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.surname }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.patronymic }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.group }}</td>
            <td>{{ student.faculty }}</td>
        </tr>
        {% else %}
        <tr><td colspan="7" style="text-align:center;">Нет студентов</td></tr>
        {% endfor %}
    </table>
</body>
</html>
