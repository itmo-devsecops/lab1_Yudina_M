<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить студента</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            padding: 20px;
        }
        form {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 15px;
            width: 100%%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center;">Добавить студента</h1>
    <form method="post">
        <label>Фамилия:</label>
        <input type="text" name="surname" required>
        <label>Имя:</label>
        <input type="text" name="name" required>
        <label>Отчество:</label>
        <input type="text" name="patronymic">
        <label>Курс:</label>
        <input type="number" name="course" min="1" max="5" required>
        <label>Группа:</label>
        <input type="text" name="group" required>
        <label>Факультет:</label>
        <input type="text" name="faculty" required>
        <button type="submit">Добавить</button>
    </form>
    <a href="{{ url_for('index') }}">Назад к списку</a>
</body>
</html>
