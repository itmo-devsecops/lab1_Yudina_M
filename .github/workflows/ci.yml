name: CI Pipeline

on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 5'   # Запуск каждую пятницу в 08:00 UTC

jobs:

  flake8:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: |
          pip install ruff

      - name: Run ruff
        run: ruff check .

  bandit:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r .

  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  docker:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    needs: [flake8, ruff, bandit, pytest]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:latest .

      - name: Run container for tests
        run: |
          docker run -d -p 5000:5000 --name test_container app:latest
          sleep 5

      - name: Curl healthcheck
        run: curl -f http://localhost:5000/healthcheck

      - name: Stop container
        run: docker stop test_container

      - name: Remove container
        run: docker rm test_container
