name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * 5"

jobs:

  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 .

      - name: Run pytest
        run: pytest || true

  build_docker:
    runs-on: ubuntu-latest
    needs: lint_and_tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:latest .

  trivy_scan:
    runs-on: ubuntu-latest
    needs: build_docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.48.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.48.0_Linux-64bit.deb

      - name: Docker build
        run: docker build -t app:latest .

      - name: Run Trivy
        run: trivy image --format json -o trivy-report.json app:latest

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  healthcheck_test:
    runs-on: ubuntu-latest
    needs: build_docker
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:latest .

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name app_container app:latest
          sleep 5

      - name: Check healthcheck endpoint
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5000/healthcheck)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Healthcheck FAILED"
            exit 1
          fi

  ruff_lint:
    runs-on: ubuntu-latest
    needs: lint_and_tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

  bandit_scan:
    runs-on: ubuntu-latest
    needs: lint_and_tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  hadolint_check:
    runs-on: ubuntu-latest
    needs: build_docker
    steps:
      - uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Run hadolint
        run: hadolint Dockerfile || true

  generate_report:
    runs-on: ubuntu-latest
    needs: [ruff_lint, bandit_scan, trivy_scan]
    steps:
      - uses: actions/checkout@v4

      - name: Generate final security report
        run: |
          echo "# Security Report" > security-report.md
          echo "## Ruff, Bandit, Trivy summary" >> security-report.md
          echo "- Ruff completed" >> security-report.md
          echo "- Bandit report saved" >> security-report.md
          echo "- Trivy report saved" >> security-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
