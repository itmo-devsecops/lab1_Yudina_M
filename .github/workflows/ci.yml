name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Раз в неделю (пятница 12:00)
  schedule:
    - cron: "0 12 * * 5"

jobs:
  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest ruff bandit

      - name: Run flake8
        run: |
          mkdir -p artifacts/flake8
          flake8 . --output-file artifacts/flake8/flake8-report.txt || true

      - name: Run pytest
        run: |
          pytest || true

      - name: Run ruff
        run: |
          mkdir -p artifacts/ruff
          ruff check . --format=json > artifacts/ruff/ruff.json || true

      - name: Run bandit
        run: |
          mkdir -p artifacts/bandit
          bandit -r . -f json -o artifacts/bandit/bandit.json || true

      - name: Upload lint/test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-test-security
          path: artifacts/

  docker_and_trivy:
    runs-on: ubuntu-latest
    needs: lint_and_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:latest .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo tee /etc/apt/trusted.gpg.d/trivy.asc
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy
        run: |
          mkdir -p artifacts/trivy
          trivy fs --exit-code 0 --no-progress --format json \
            --output artifacts/trivy/trivy.json .

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: artifacts/trivy/

  healthcheck:
    runs-on: ubuntu-latest
    needs: docker_and_trivy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:latest .

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name test_container app:latest
          sleep 5

      - name: Healthcheck
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5000/healthcheck)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Healthcheck FAILED"
            exit 1
          fi
          echo "Healthcheck OK"

  hadolint:
    runs-on: ubuntu-latest
    needs: lint_and_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Run Hadolint
        run: |
          mkdir -p artifacts/hadolint
          hadolint Dockerfile > artifacts/hadolint/hadolint.txt || true

      - name: Upload Hadolint artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadolint
          path: artifacts/hadolint/

  summary:
    runs-on: ubuntu-latest
    needs: [lint_and_tests, docker_and_trivy, hadolint]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate summary.md
        run: |
          python3 << 'EOF'
          import json, os

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except:
                  return None

          lines = ["# Security Summary Report\n"]

          ruff = load("artifacts/lint-test-security/ruff/ruff.json")
          if ruff:
              lines.append(f"## Ruff\nIssues: {len(ruff)}\n")

          bandit = load("artifacts/lint-test-security/bandit/bandit.json")
          if bandit:
              issues = bandit.get("results", [])
              lines.append(f"## Bandit\nIssues: {len(issues)}\n")

          trivy = load("artifacts/trivy/trivy.json")
          if trivy:
              total = sum(len(r.get("Vulnerabilities", []) or []) for r in trivy.get("Results", []))
              lines.append(f"## Trivy\nVulnerabilities: {total}\n")

          with open("summary.md", "w") as f:
              f.write("\n".join(lines))
          EOF

      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: summary.md
