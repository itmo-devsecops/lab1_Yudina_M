# pre-commit hook для проверки секретов с помощью gitleaks
repos:
  - repo: local
    hooks:
      - id: gitleaks-local
        name: gitleaks (detect secrets)
        entry: "C:/Users/User/AppData/Local/Microsoft/WinGet/Links/gitleaks.exe protect --staged --config .gitleaks.toml"
        language: system
        pass_filenames: false
        verbose: true
